<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dall &amp; Partners – Lead Capture, CRM and Client Portal (prototype)</title>
<meta name="description" content="Clickable prototype of the lead capture, CRM and client portal proposed for Dall &amp; Partners.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230B1320'/><rect x='9' y='7' width='4' height='18' fill='%23C9A45D'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1320; --navy2:#131D30; --gold:#C9A45D; --goldd:#8A6D3B; --tint:#FAF6EE;
  --ink:#0F172B; --text:#314158; --muted:#5B6B82; --line:#E2E8F0; --soft:#F6F8FB;
  --wp-side:#1d2327; --wp-side2:#2c3338; --wp-blue:#2271b1; --wp-bg:#f0f0f1;
  --note-bg:#FFF8E8; --note-line:#C9A45D; --man-bg:#FFF1E6; --man-line:#C2410C; --man-ink:#9A3412;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);background:#e9edf3;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit}
a{color:var(--goldd)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* ---------- Demo bar ---------- */
.demobar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 18px;border-bottom:3px solid var(--gold)}
.demobar .brand{display:flex;align-items:center;gap:10px;font-weight:700}
.demobar .brand i{display:block;width:5px;height:26px;background:var(--gold)}
.demobar .brand small{display:block;color:var(--gold);font-weight:600;font-size:11px}
.tabs{display:flex;gap:4px;background:var(--navy2);padding:4px;border-radius:10px}
.tabs button{background:none;border:0;color:#CBD5E1;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.tabs button.on{background:var(--gold);color:var(--navy)}
.demobar .tools{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;color:#E2E8F0}
.switch input{width:36px;height:20px;appearance:none;background:#475569;border-radius:20px;position:relative;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{left:18px}
.linkbtn{background:none;border:1px solid #475569;color:#E2E8F0;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.linkbtn:hover{border-color:var(--gold);color:#fff}

/* ---------- Stage & browser frame ---------- */
.stage{max-width:1280px;margin:18px auto 40px;padding:0 14px}
.browser{background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(11,19,32,.12);overflow:hidden;border:1px solid #cfd6e0}
.bbar{display:flex;align-items:center;gap:10px;background:#dfe4ea;padding:8px 12px}
.dots{display:flex;gap:6px}.dots span{width:11px;height:11px;border-radius:50%;background:#b8c0cc}
.url{flex:1;background:#fff;border-radius:7px;padding:5px 12px;font-size:13px;color:#475569;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url b{color:#16a34a;font-weight:700}
.subnav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:#f4f6f9;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.subnav span{color:var(--muted);margin-right:4px}
.subnav button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink);font-weight:600}
.subnav button.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------- Notes ---------- */
.note,.manual{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13.5px;line-height:1.5;text-align:left}
.note{background:var(--note-bg);border:1px solid #EBD9B0;border-left:4px solid var(--note-line);color:#5c4a24}
.manual{background:var(--man-bg);border:1px solid #F5C9A6;border-left:4px solid var(--man-line);color:var(--man-ink)}
.note b.k,.manual b.k{white-space:nowrap}
.note .ic,.manual .ic{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
.note .ic{background:var(--goldd)}.manual .ic{background:var(--man-line)}
body.hide-notes .note,body.hide-notes .manual{display:none}

/* ---------- Website (brand) ---------- */
.site{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text)}
.s-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line);background:#fff}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo i{width:5px;height:30px;background:var(--gold);display:block}
.logo b{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:21px;color:var(--ink);letter-spacing:.02em;display:block;line-height:1}
.logo small{display:block;font-size:11px;color:var(--goldd);margin-top:3px}
.s-nav{display:flex;flex-wrap:wrap;gap:18px;font-size:14px;font-weight:600}
.s-nav a{color:var(--ink);text-decoration:none;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:12px 20px;font-weight:700;font-size:14px;cursor:pointer;border:1.5px solid var(--gold);text-decoration:none;line-height:1.2}
.btn-gold{background:var(--gold);color:var(--navy)}.btn-gold:hover{background:var(--goldd);border-color:var(--goldd);color:#fff}
.btn-ghost{background:transparent;color:#fff}.btn-ghost:hover{background:rgba(201,164,93,.16)}
.btn-line{background:#fff;color:var(--ink)}.btn-line:hover{border-color:var(--goldd)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px}
.hero{background:var(--navy);color:#fff;padding:64px 28px 72px;text-align:center}
.hero h1{color:#fff;font-size:clamp(28px,4vw,44px);line-height:1.12;font-weight:800;margin:10px auto 14px;max-width:760px}
.hero p{color:#CBD5E1;max-width:640px;margin:0 auto 26px;font-size:16px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.kicker{color:var(--gold);font-weight:700;font-size:13px}
.s-sec{padding:44px 28px;max-width:1080px;margin:0 auto}
.s-sec h2{color:var(--ink);font-size:26px;margin:0 0 6px;font-weight:800}
.s-sec .lead{color:var(--muted);margin:0 0 22px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.box{border:1px solid var(--line);border-radius:14px;padding:20px;background:#fff}
.box h3{color:var(--ink);font-size:17px;margin:0 0 6px}
.box p{margin:0 0 12px;font-size:14px}
.box .go{font-weight:700;font-size:14px;color:var(--goldd);cursor:pointer;background:none;border:0;padding:0}
.banner{background:var(--tint);border:1px solid #EBD9B0;border-radius:14px;padding:18px 22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.banner b{color:var(--ink)}
.s-foot{background:var(--navy);color:#94A3B8;padding:26px 28px;font-size:13px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.step{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff}
.step .n{width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:10px}
.step h3{margin:0 0 4px;color:var(--ink);font-size:16px}
.step p{margin:0;font-size:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.ticks{list-style:none;padding:0;margin:14px 0}
.ticks li{padding-left:26px;position:relative;margin-bottom:8px;color:var(--ink);font-weight:500}
.ticks li::before{content:"✓";position:absolute;left:0;color:var(--goldd);font-weight:800}
.cal{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.cal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.cal-h b{color:var(--ink)}
.cal-b{padding:16px 18px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:14px}
.day{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px;cursor:pointer;text-align:center;color:var(--ink)}
.day small{display:block;color:var(--muted);font-size:11px}
.day.on{border-color:var(--gold);background:var(--tint)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1.5px solid var(--gold);background:#fff;color:var(--goldd);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.slot.on{background:var(--gold);color:var(--navy)}
.okbox{background:#ECFDF3;border:1px solid #A7F3D0;color:#065F46;border-radius:12px;padding:14px 16px}
.article{max-width:760px}
.article p{font-size:16px;line-height:1.75}
.nextstep{background:var(--navy);border-left:4px solid var(--gold);border-radius:14px;padding:24px;margin:26px 0}
.nextstep h3{color:#fff;margin:6px 0 8px;font-size:20px}
.nextstep p{color:#CBD5E1;margin:0 0 16px}
.nextstep .k{color:var(--gold);font-size:12px;font-weight:700}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(11,19,32,.62);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.modal.dark{background:var(--navy);color:#E2E8F0}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 6px}
.modal-h h2{margin:0;font-size:21px;color:inherit}
.modal.dark .modal-h h2{color:#fff}
.modal-b{padding:6px 22px 22px}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:inherit;padding:4px 8px;border-radius:8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.f label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border-radius:9px;border:1px solid #CBD5E1;padding:10px 12px;background:#fff;color:var(--ink)}
.modal.dark .f input,.modal.dark .f select,.modal.dark .f textarea{background:#0B1320;border-color:#2A3450;color:#fff}
.modal.dark .f label{color:#E2E8F0}
.f textarea{min-height:84px;resize:vertical}
.full{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.req{color:#e11d48}

/* ---------- WordPress-style admin ---------- */
.wp{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:640px;background:var(--wp-bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;font-size:13.5px;color:#1d2327}
.wp-side{background:var(--wp-side);color:#f0f0f1;padding:8px 0}
.wp-side .grp{padding:10px 14px 4px;color:#9ca2a7;font-size:11px;font-weight:600}
.wp-side button{display:block;width:100%;text-align:left;background:none;border:0;color:#f0f0f1;padding:8px 14px;cursor:pointer;font-size:13.5px}
.wp-side button:hover{background:var(--wp-side2);color:#72aee6}
.wp-side button.on{background:var(--wp-blue);color:#fff}
.wp-main{padding:18px 22px;min-width:0}
.wp-main h1{font-size:23px;font-weight:400;margin:0 0 12px;color:#1d2327;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.wp-main h2{font-size:16px;margin:16px 0 8px;color:#1d2327}
.wpbtn{background:var(--wp-blue);color:#fff;border:1px solid var(--wp-blue);border-radius:3px;padding:5px 12px;cursor:pointer;font-size:13px;line-height:1.6}
.wpbtn:hover{background:#135e96}
.wpbtn.sec{background:#f6f7f7;color:var(--wp-blue);border-color:var(--wp-blue)}
.wpbtn.sec:hover{background:#f0f0f1}
.wpbtn.warn{background:#fff;color:#b32d2e;border-color:#b32d2e}
.panel{background:#fff;border:1px solid #c3c4c7;border-radius:4px;padding:14px 16px;margin-bottom:14px}
.cards4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid #c3c4c7;border-radius:4px;padding:14px}
.stat b{display:block;font-size:26px;font-weight:600;color:#1d2327}
.stat span{color:#50575e}
table.wpt{width:100%;border-collapse:collapse;background:#fff;border:1px solid #c3c4c7}
.wpt th{text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid #c3c4c7;background:#fff}
.wpt td{padding:9px 10px;border-bottom:1px solid #f0f0f1;vertical-align:top}
.wpt tr:nth-child(even) td{background:#f6f7f7}
.wpt a{color:var(--wp-blue);cursor:pointer;text-decoration:none;font-weight:600}
.scroll{overflow-x:auto}
.pill{display:inline-block;background:#f0f6fc;border:1px solid #c5d9ed;color:#135e96;border-radius:999px;padding:1px 8px;font-size:12px;margin:2px 3px 2px 0;white-space:nowrap}
.pill.list{background:#f6f7f7;border-color:#dcdcde;color:#3c434a}
.pill.ok{background:#edfaef;border-color:#b8e6bf;color:#00692e}
.pill.gold{background:var(--tint);border-color:#EBD9B0;color:var(--goldd)}
.pill .rm{border:0;background:none;color:inherit;cursor:pointer;padding:0 0 0 4px;font-weight:700}
.wptabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid #c3c4c7;margin:4px 0 14px}
.wptabs button{background:none;border:1px solid transparent;border-bottom:0;padding:8px 14px;cursor:pointer;color:#50575e;font-weight:600;margin-bottom:-1px}
.wptabs button.on{background:#fff;border-color:#c3c4c7;color:#1d2327}
.kv{display:grid;grid-template-columns:160px minmax(0,1fr);gap:6px 12px}
.kv dt{color:#50575e}.kv dd{margin:0;color:#1d2327;font-weight:500}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f0f0f1;align-items:flex-start}
.timeline .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:5px;background:#c3c4c7}
.timeline .dot.sent{background:#00a32a}.timeline .dot.sch{background:#dba617}.timeline .dot.stop{background:#b32d2e}
.small{font-size:12px;color:#50575e}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{border:1px solid #8c8f94;border-radius:3px;padding:5px 8px;background:#fff;font-size:13px;min-width:0}

/* ---------- Kanban (pipeline) ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#e7eaee;border-radius:8px;padding:10px;min-height:300px}
.col h3{font-size:13px;margin:0 0 10px;display:flex;justify-content:space-between;color:#1d2327}
.col.drop{outline:2px dashed var(--wp-blue);outline-offset:-4px}
.kcard{background:#fff;border-radius:6px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.12);cursor:grab;border-left:4px solid #c3c4c7}
.kcard.Hot{border-left-color:#d63638}.kcard.Warm{border-left-color:#dba617}.kcard.Cold{border-left-color:#2271b1}
.kcard b{display:block;font-size:13px;color:#1d2327;margin-bottom:4px}
.kcard .meta{font-size:12px;color:#50575e;display:flex;flex-wrap:wrap;gap:4px 10px}
.kcard .due.late{color:#b32d2e;font-weight:600}

/* ---------- Projects (portal staff) ---------- */
.prog{height:8px;background:#dcdcde;border-radius:8px;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:#00a32a}
.tlist{background:#fff;border:1px solid #c3c4c7;border-radius:4px;margin-bottom:12px}
.tlist h3{margin:0;padding:10px 14px;border-bottom:1px solid #f0f0f1;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.task{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid #f6f7f7;flex-wrap:wrap}
.task:last-child{border-bottom:0}
.task label{display:flex;gap:8px;align-items:center;flex:1;min-width:200px;cursor:pointer}
.task.done label span{text-decoration:line-through;color:#8c8f94}
.task .who{font-size:12px;color:#50575e}
.task .when{font-size:12px;color:#50575e;min-width:90px}
.task .when.late{color:#b32d2e;font-weight:600}

/* ---------- Chat ---------- */
.chat{display:grid;grid-template-columns:220px minmax(0,1fr);border:1px solid #c3c4c7;border-radius:6px;background:#fff;min-height:420px;overflow:hidden}
@media (max-width:700px){.chat{grid-template-columns:1fr}}
.chat-list{border-right:1px solid #e0e0e0;background:#fafafa}
.chat-list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;background:none;padding:12px;cursor:pointer}
.chat-list button.on{background:#f0f6fc}
.chat-list small{display:block;color:#50575e}
.chat-main{display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:8px;max-height:380px;overflow-y:auto}
.msg{max-width:78%;padding:8px 12px;border-radius:12px;background:#f0f0f1;font-size:13.5px}
.msg.me{align-self:flex-end;background:#2271b1;color:#fff}
.msg small{display:block;font-size:11px;opacity:.75;margin-top:2px}
.chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid #eee}
.chat-in input{flex:1}

/* ---------- Client portal (brand) ---------- */
.portal-head{background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 26px}
.portal-head .logo b{color:#fff}
.portal-wrap{padding:26px;max-width:1100px;margin:0 auto}
.pgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.pgrid{grid-template-columns:1fr}}
.pcard{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff;margin-bottom:18px}
.pcard h3{margin:0 0 10px;color:var(--ink);font-size:17px}
.stages{list-style:none;padding:0;margin:0}
.stages li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #f1f5f9}
.stages li:last-child{border-bottom:0}
.stages .s{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);flex:0 0 26px}
.stages li.done .s{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.stages li.now .s{border-color:var(--gold);color:var(--goldd)}
.stages li.now b{color:var(--goldd)}
.doc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.doc:last-child{border-bottom:0}
.login{max-width:420px;margin:50px auto;border:1px solid var(--line);border-radius:16px;padding:26px;background:#fff}
.login h2{margin:0 0 6px;color:var(--ink)}

/* ---------- Welcome ---------- */
.welcome .modal-b p{color:#CBD5E1}
.welcome ol{color:#E2E8F0;padding-left:20px}
.welcome li{margin-bottom:6px}
.legend{display:grid;gap:8px;margin:14px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3);border-left:4px solid var(--gold);max-width:90vw;font-size:14px}
@media (max-width:760px){
  .wp{grid-template-columns:1fr}
  .wp-side{display:flex;flex-wrap:wrap;gap:2px;padding:6px}
  .wp-side .grp{width:100%;padding:6px 8px 2px}
  .wp-side button{width:auto;border-radius:4px;padding:6px 10px}
  .kv{grid-template-columns:1fr}
  .demobar .tools{margin-left:0}
}

  return '<div class="overlay" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="nk-h"><div class="modal-h"><h2 id="nk-h">Add card to “New lead”</h2><button class="x" data-act="close" aria-label="Close">×</button></div><div class="modal-b">' +
    note('in Fluent Boards, the advisor types the card title (name, program, budget) and pastes the link to the contact in the CRM.') +
    '<div class="fgrid"><div class="f full"><label for="nk-c">Lead</label><select id="nk-c">' + free.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + ' – ' + esc(c.program.split(' /')[0]) + '</option>'; }).join('') + '</select></div>' +
    '<div class="f"><label for="nk-a">Assignee</label><select id="nk-a">' + ADVISORS.map(function (a) { return '<option>' + a + '</option>'; }).join('') + '</select></div>' +
    '<div class="f"><label for="nk-d">Due date (next follow-up)</label><input id="nk-d" type="date" value="' + iso(addDays(today(), 1)).slice(0, 10) + '"></div>' +
    '<div class="f"><label for="nk-l">Label</label><select id="nk-l"><option>Hot</option><option selected>Warm</option><option>Cold</option></select></div></div>' +
    '<button class="btn btn-gold" style="margin-top:14px" data-act="card-create">Add card</button></div></div></div>';
}
function handoverModal(k) {
  var c = contact(k.contact);
  var steps = ['On the contact: add tag “Won” and the list “Clients – signed” (stops marketing emails)', 'Portal: create the client’s account (role: Subscriber) and send the password email', 'Portal: copy the case template and rename it “' + c.name + ' – [program]”; add the client and staff', 'Portal: share the signed engagement letter in the client’s private documents', 'Send the welcome email with the portal link and next three steps'];
  return '<div class="overlay" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ho-h"><div class="modal-h"><h2 id="ho-h">Client signed: ' + esc(c.name) + '</h2><button class="x" data-act="close" aria-label="Close">×</button></div><div class="modal-b">' +
    manual('the handover from the CRM to the portal is done by hand. In this demo, “Complete handover” does all five steps at once so you can see the result in the portal.') +
    '<ol>' + steps.map(function (s) { return '<li style="margin-bottom:6px">' + esc(s) + '</li>'; }).join('') + '</ol><div class="f" style="margin:10px 0"><label for="ho-p">Program</label><select id="ho-p">' + P.map(function (p) { return '<option>' + esc(p.n) + '</option>'; }).join('') + '</select></div><button class="btn btn-gold" data-act="handover" data-card="' + k.id + '">Complete handover</button></div></div></div>';
}
function addContactModal() {
  function sel(id, label, opts, val) { return '<div class="f"><label for="' + id + '">' + label + '</label><select id="' + id + '" name="' + id + '">' + opts.map(function (o) { return '<option' + (o === val ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>'; }
  return '<div class="overlay" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ac-h"><div class="modal-h"><h2 id="ac-h">Add contact</h2><button class="x" data-act="close" aria-label="Close">×</button></div><form class="modal-b" data-form="addcontact">' +
    note('contacts who fill in a form on the website are added automatically, with all their answers. Only people who contact you another way (WhatsApp, phone, referral) are typed in here. Email is required.') +
    '<div class="fgrid"><div class="f"><label for="first">First name <span class="req">*</span></label><input id="first" name="first" required value="Yusuf"></div><div class="f"><label for="last">Last name</label><input id="last" name="last" value="Demir"></div>' +
    '<div class="f"><label for="email">Email <span class="req">*</span></label><input id="email" name="email" type="email" required value="yusuf.demir@example.com"></div><div class="f"><label for="phone">Phone</label><input id="phone" name="phone" value="+90 532 123 4567"></div>' +
    '<div class="f"><label for="country">Country</label><input id="country" name="country" value="Türkiye"></div>' +
    sel('source', 'Lead source', ['WhatsApp', 'Phone', 'Referral', 'Consultation page', 'Event'], 'WhatsApp') +
    sel('program', 'Program of interest', ['Not sure – compare programs for me', 'Citizenship by Investment', 'Golden Visa / Residency by Investment', 'Real Estate Residency', 'Entrepreneur / Business Visa', 'Retirement / Passive Income Visa', 'Digital Nomad / Remote Work Visa'], 'Golden Visa / Residency by Investment') +
    sel('budget', 'Budget range', ['Not sure yet', 'No investment – income or savings', 'Under US$50,000', 'US$50,000 – US$150,000', 'US$150,000 – US$300,000', 'US$300,000 – US$600,000', 'US$600,000 – US$1 million', 'Over US$1 million'], 'US$300,000 – US$600,000') +
    sel('timeline', 'Timeline', ['Immediately (within 1 month)', 'In 1–3 months', 'In 3–6 months', 'In 6–12 months', 'Just researching for now'], 'In 1–3 months') +
    sel('list', 'Add to list', LISTS, 'Consultation enquiries') +
    '</div><button class="btn btn-gold" type="submit" style="margin-top:14px">Add contact</button></form></div></div>';
}
function welcomeModal() {
  return '<div class="overlay"><div class="modal dark welcome" role="dialog" aria-modal="true" aria-labelledby="wl-h"><div class="modal-h"><h2 id="wl-h">Lead Capture, CRM and Client Portal – prototype</h2></div><div class="modal-b"><p>A clickable demo of the system proposed for Dall &amp; Partners, built on the free versions of the WordPress plugins.</p><ol><li><b>Website</b>: book a consultation, take the Program Finder, download the guide.</li><li><b>CRM</b>: see the new lead, its follow-up emails and the sales pipeline. Drag a card to “Won”.</li><li><b>Client portal</b>: the case created for the client, tasks, chat, and the client’s own dashboard.</li></ol>' +
    '<div class="legend">' + note('what happens in the real system (emails, links to dallandpartners.com).') + manual('a task staff do by hand on the free plugin versions.') + '</div>' +
    '<p class="small" style="color:#94A3B8">Staff screens are a simplified representation of the plugins’ admin screens. No emails are sent and no real data is stored; demo data stays in this browser. Use “Reset demo” to start again. For a full explanation of each stage, open “How the process works”.</p><button class="btn btn-gold" data-act="close-welcome">Start the demo</button></div></div></div>';
}

/* ---------- render ---------- */
var MODAL = null;
function render() {
  document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.area === R.area); b.setAttribute('aria-selected', b.dataset.area === R.area); });
  var html = R.area === 'site' ? siteView() : R.area === 'crm' ? crmView() : portalView();
  $('#stage').innerHTML = html;
  $('#modal').innerHTML = MODAL || '';
}
function openModal(h) { MODAL = h; $('#modal').innerHTML = h; var f = $('#modal [autofocus], #modal input, #modal select, #modal button'); if (f) f.focus(); }
function closeModal() { MODAL = null; $('#modal').innerHTML = ''; }

/* ---------- actions ---------- */
function addContactFromForm(d, kind) {
  var t = today(), c = { id: uid(), name: d.name, email: d.email, phone: d.phone || '', country: '', program: d.program || '', budget: d.budget || '', timeline: d.timeline || '',
    source: kind, lists: [], tags: ['Source – website'], status: 'Subscribed', created: iso(new Date()), advisor: '', notes: [], emails: [], seq: null, message: d.message || '' };
  if (kind === 'Guide download') { c.lists = ['Guide downloads']; enrollNew(c, 'guide'); }
  else {
    c.lists = ['Consultation enquiries'];
    if ((d.message || '').indexOf('Program Finder answers') === 0) { c.lists.push('Program Finder leads'); c.source = 'Program Finder'; enrollNew(c, 'quiz'); }
  }
  var existing = S.contacts.filter(function (x) { return x.email.toLowerCase() === c.email.toLowerCase(); })[0];
  if (existing) { c.lists.forEach(function (l) { if (existing.lists.indexOf(l) < 0) existing.lists.push(l); }); existing.emails = existing.emails.concat(c.emails); if (c.seq) existing.seq = c.seq; existing.message = c.message || existing.message; S.last = existing.id; }
  else { S.contacts.push(c); S.last = c.id; }
  save();
}
function enrollNew(c, key) { var t = new Date(); c.seq = key; SEQ[key].emails.forEach(function (e) { c.emails.push({ subject: e[0], state: e[1] === 0 ? 'sent' : 'scheduled', date: iso(addDays(t, e[1])), kind: SEQ[key].name }); }); }

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-go],[data-act],[data-day],[data-slot],[data-q],[data-ctab],[data-ptab],[data-cctab],[data-rmtag],[data-chat]');
  if (!el) { if (e.target.dataset && e.target.dataset.close) closeModal(); return; }
  if (el.matches('a[href="#"]')) e.preventDefault();
  if (el.dataset.go) { var p = el.dataset.go.split(':'); if (p[0] === 'portal' && p[1] === 'client') { R.clientCase = false; go('portal', 'client'); return; } go(p[0], p[1], el.dataset.id, el.dataset.tab); return; }
  if (el.dataset.day) { BK.day = el.dataset.day; BK.time = null; render(); return; }
  if (el.dataset.slot) { BK.time = el.dataset.slot; render(); return; }
  if (el.dataset.q !== undefined) { QZ.A[Q[QZ.step].k] = el.dataset.q; QZ.step++; render(); return; }
  if (el.dataset.ctab) { R.tab = el.dataset.ctab; render(); return; }
  if (el.dataset.ptab) { R.tab = el.dataset.ptab; render(); return; }
  if (el.dataset.cctab) { R.ctab = el.dataset.cctab; render(); return; }
  if (el.dataset.chat) { R.chat = el.dataset.chat; render(); return; }
  if (el.dataset.rmtag) { var c0 = contact(R.id); c0.tags = c0.tags.filter(function (t) { return t !== el.dataset.rmtag; }); save(); render(); return; }
  var a = el.dataset.act, c = R.id ? contact(R.id) : null;
  switch (a) {
    case 'consult-quiz': R.prefill = { message: QZ.summary, program: QZ.program && /Citizenship/.test(QZ.program) ? 'Citizenship by Investment' : /Residency by/.test(QZ.program) ? 'Golden Visa / Residency by Investment' : /Real Estate/.test(QZ.program) ? 'Real Estate Residency' : /Entrepreneur/.test(QZ.program) ? 'Entrepreneur / Business Visa' : /Independent/.test(QZ.program) ? 'Retirement / Passive Income Visa' : /Nomad/.test(QZ.program) ? 'Digital Nomad / Remote Work Visa' : '' }; go('site', 'consult'); break;
    case 'close': closeModal(); break;
    case 'close-welcome': closeModal(); try { localStorage.setItem(KEY + '-seen', '1'); } catch (x) {} break;
    case 'q-back': QZ.step = Math.max(0, QZ.step - 1); render(); break;
    case 'q-restart': QZ = { step: 0, A: {} }; render(); break;
    case 'bk-reset': BK = { day: null, time: null, done: null }; render(); break;
    case 'bk-confirm':
      var where = el.dataset.where, dd = new Date(BK.day);
      if (where === 'site') {
        var bn = ($('#bk-n') || {}).value || 'Visitor', be = (($('#bk-e') || {}).value || '').trim().toLowerCase();
        var lc = S.contacts.filter(function (x) { return x.email.toLowerCase() === be; })[0];
        if (!lc) { lc = { id: uid(), name: bn, email: be || 'visitor@example.com', phone: '', country: '', program: '', budget: '', timeline: '', source: 'Booking calendar', lists: ['Consultation enquiries'], tags: [], status: 'Subscribed', created: iso(new Date()), advisor: '', notes: [], emails: [], seq: null, message: '' }; S.contacts.push(lc); }
        S.last = lc.id;
        S.bookings.push({ id: uid(), contact: lc.id, date: iso(dd), time: BK.time, advisor: ADVISORS[0], type: 'Free 30-minute consultation' });
        if (lc.tags.indexOf('Consultation booked') < 0) lc.tags.push('Consultation booked');

      } else { var cs = S.cases[S.cases.length - 1]; cs.messages.push({ by: cs.client, me: true, text: 'I booked a case update call for ' + fmtShort(dd) + ' at ' + BK.time + '.', date: iso(new Date()) }); }
      BK.done = { where: where, day: dd, time: BK.time }; save(); render(); toast('Booking confirmed'); break;
    case 'pdf': window.open('Program-Comparison-2026-Dall-and-Partners.pdf', '_blank'); break;
    case 'dl': toast('In the live portal, the document downloads securely.'); break;
    case 'add-contact': openModal(addContactModal()); break;
    case 'del-contact':
      var dc = contact(el.dataset.id); if (!dc) break;
      if (!confirm('Delete ' + dc.name + '? This removes the contact, their notes and email history from the CRM.')) break;
      S.contacts = S.contacts.filter(function (x) { return x.id !== dc.id; });
      S.cards = S.cards.filter(function (x) { return x.contact !== dc.id; });
      S.bookings = S.bookings.filter(function (x) { return x.contact !== dc.id; });
      if (S.last === dc.id) S.last = null;
      save(); go('crm', 'contacts'); toast('Contact deleted'); break;
    case 'add-tag': var ts = $('#tagsel'); if (ts && c.tags.indexOf(ts.value) < 0) { c.tags.push(ts.value); if (ts.value === 'Won' || ts.value === 'Lost') {} save(); render(); } break;
    case 'add-note': var nt = $('#nt'); if (nt && nt.value.trim()) { c.notes.push({ by: c.advisor || ADVISORS[0], date: iso(new Date()), text: nt.value.trim() }); save(); render(); toast('Note added'); } break;
    case 'stop-seq': c.emails.forEach(function (x) { if (x.state === 'scheduled') x.state = 'stopped'; }); c.seq = null; save(); render(); toast('Automation cancelled – no more follow-up emails'); break;
    case 'to-pipeline-old': S.cards.push({ id: uid(), contact: c.id, stage: c.tags.indexOf('Consultation booked') > -1 ? 'Consultation booked' : 'New lead', assignee: c.advisor || ADVISORS[0], due: iso(addDays(today(), 1)), label: 'Warm' }); save(); render(); toast('Added to the sales pipeline'); break;
    case 'send-reminder':
      var due = S.contacts.filter(function (x) { return x.lists.indexOf('Consultation enquiries') > -1 && x.tags.indexOf('Consultation booked') < 0 && x.tags.indexOf('Won') < 0; });
      due.forEach(function (x) { x.emails.push({ subject: 'Choose a time for your free consultation', state: 'sent', date: iso(new Date()), kind: 'Weekly reminder (manual campaign)' }); }); save(); render(); toast('Reminder sent to ' + due.length + ' contacts'); break;
    case 'av-save':
      S.availability.days = Array.prototype.slice.call(document.querySelectorAll('[data-av]')).filter(function (x) { return x.checked; }).map(function (x) { return x.dataset.av; });
      S.availability.from = $('[data-avt=from]').value; S.availability.to = $('[data-avt=to]').value; save(); toast('Availability saved'); break;
    case 'card-new': openModal(newCardModal()); break;
    case 'card-create':
      var nk = { id: uid(), contact: $('#nk-c').value, stage: 'New lead', assignee: $('#nk-a').value, due: iso(new Date($('#nk-d').value + 'T09:00')), label: $('#nk-l').value };
      S.cards.push(nk); save(); closeModal(); render(); toast('Card added to the sales board'); break;
    case 'card-open': openModal(cardModal(S.cards.filter(function (k) { return k.id === el.dataset.card; })[0])); break;
    case 'card-save':
      var k = S.cards.filter(function (x) { return x.id === el.dataset.card; })[0], ns = $('#k-s').value;
      k.assignee = $('#k-a').value; k.due = iso(new Date($('#k-d').value + 'T09:00')); k.label = $('#k-l').value;
      closeModal(); moveCard(k, ns); break;
    case 'handover':
      var hk = S.cards.filter(function (x) { return x.id === el.dataset.card; })[0], hc = contact(hk.contact), prog = $('#ho-p').value;
      ['Won'].forEach(function (t) { if (hc.tags.indexOf(t) < 0) hc.tags.push(t); }); if (hc.lists.indexOf('Clients – signed') < 0) hc.lists.push('Clients – signed');
      hc.emails.forEach(function (x) { if (x.state === 'scheduled') x.state = 'stopped'; }); hc.seq = null;
      var ncs = makeCase(hc, prog, [hk.assignee, ADVISORS.filter(function (a) { return a !== hk.assignee; })[0]]); ncs.lists[0].tasks[0].done = true; ncs.lists[0].tasks[2].done = true;
      ncs.files.push({ name: new Date().getFullYear() + ' – ' + hc.name.split(' ').pop() + ' – Engagement letter (signed).pdf', by: hk.assignee, shared: true, date: iso(new Date()) });
      ncs.messages.push({ by: hk.assignee, me: false, text: 'Welcome to Dall & Partners, ' + hc.name.split(' ')[0] + '! Your case is now open. Please upload the documents listed in your case.', date: iso(new Date()) });
      S.cases.push(ncs); save(); closeModal(); toast('Handover complete – case created in the portal'); go('portal', 'project', ncs.id); break;
    case 'add-disc': var ds = $('#dsc'), dcs = S.cases.filter(function (x) { return x.id === R.id; })[0]; if (ds && ds.value.trim()) { dcs.discussions.push({ by: 'Khushbakht H.', date: iso(new Date()), text: ds.value.trim() }); save(); render(); } break;
    case 'upload-staff': var ucs = S.cases.filter(function (x) { return x.id === R.id; })[0]; ucs.files.push({ name: new Date().getFullYear() + ' – ' + ucs.client.split(' ').pop() + ' – Approval letter.pdf', by: 'Khushbakht H.', shared: true, date: iso(new Date()) }); save(); render(); toast('File uploaded and shared with the client'); break;
    case 'upload-client': var ccs = S.cases[S.cases.length - 1]; ccs.files.push({ name: new Date().getFullYear() + ' – ' + ccs.client.split(' ').pop() + ' – Police certificate – Spouse.pdf', by: ccs.client + ' (client)', shared: false, date: iso(new Date()) }); save(); render(); toast('Uploaded to your case files for the team to review'); ; break;
    case 'client-out': R.clientIn = false; R.clientCase = false; render(); break;
    case 'client-case': R.clientCase = true; R.ctab = 'overview'; render(); window.scrollTo({ top: 0 }); break;
    case 'client-case-files': R.clientCase = true; R.ctab = 'files'; render(); window.scrollTo({ top: 0 }); break;
    case 'client-dash': R.clientCase = false; render(); break;
    case 'reset': if (confirm('Reset the demo? All demo changes will be cleared.')) { localStorage.removeItem(KEY); S = seed(); QZ = { step: 0, A: {} }; BK = { day: null, time: null, done: null }; R.clientIn = false; R.clientCase = false; save(); go('site', 'home'); toast('Demo reset'); } break;
    case 'welcome': openModal(welcomeModal()); break;
  }
});
function moveCard(k, stage) {
  var prev = k.stage; k.stage = stage; var c = contact(k.contact);
  if (stage === 'Proposal sent' || stage === 'Lost') toast('Card moved. Update the contact’s tags in the CRM by hand (board and CRM aren’t linked).');
  save(); render();
  if (stage === 'Won' && prev !== 'Won') openModal(handoverModal(k));
}
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset.act === 'set-advisor') { var c = contact(t.dataset.id); c.advisor = t.value; save(); toast('Advisor saved'); }
  if (t.dataset.act === 'list-filter') { R.tab = t.value; render(); }
  if (t.dataset.list) { var c2 = contact(R.id); if (t.checked) { if (c2.lists.indexOf(t.dataset.list) < 0) c2.lists.push(t.dataset.list); } else c2.lists = c2.lists.filter(function (l) { return l !== t.dataset.list; }); save(); }
  if (t.dataset.task) { var cs = S.cases.filter(function (x) { return x.id === t.dataset.case; })[0]; cs.lists.forEach(function (l) { l.tasks.forEach(function (x) { if (x.id === t.dataset.task) x.done = t.checked; }); }); save(); render(); }
  if (t.id === 'notes-toggle') document.body.classList.toggle('hide-notes', !t.checked);
});
document.addEventListener('submit', function (e) {
  var f = e.target, fd = {}; e.preventDefault();
  Array.prototype.forEach.call(f.elements, function (x) { if (x.name) fd[x.name] = x.value; });
  if (f.dataset.form === 'consult') { addContactFromForm(fd, 'Consultation page'); R.prefill = null; BK = { day: null, time: null, done: null }; go('site', 'thankyou'); }
  if (f.dataset.form === 'guide') { addContactFromForm(fd, 'Guide download'); go('site', 'guidedone'); }
  if (f.dataset.form === 'chat') { var txt = fd.t; if (R.chat === 'team') S.team.push({ by: 'Khushbakht H.', text: txt, date: iso(new Date()) }); else { var cs = S.cases.filter(function (x) { return x.id === R.chat; })[0]; cs.messages.push({ by: 'Khushbakht H.', me: false, text: txt, date: iso(new Date()) }); } save(); render(); }
  if (f.dataset.form === 'clientlogin') { R.clientIn = true; render(); }
  if (f.dataset.form === 'addcontact') {
    var srcTag = { WhatsApp: 'Source – WhatsApp', Phone: 'Source – phone', Referral: 'Source – referral', 'Consultation page': 'Source – website' }[fd.source];
    var nc = { id: uid(), name: (fd.first + ' ' + (fd.last || '')).trim(), email: fd.email, phone: fd.phone, country: fd.country, program: fd.program, budget: fd.budget, timeline: fd.timeline, source: fd.source,
      lists: [fd.list], tags: srcTag ? [srcTag] : [], status: 'Subscribed', created: iso(new Date()), advisor: '', notes: [], emails: [], seq: null, message: '' };
    S.contacts.push(nc); save(); closeModal(); go('crm', 'contact', nc.id); toast('Contact added');
  }
  if (f.dataset.form === 'clientmsg') { var cc = S.cases[S.cases.length - 1]; cc.messages.push({ by: cc.client, me: true, text: fd.t, date: iso(new Date()) }); save(); render(); }
});
/* drag & drop on the pipeline */
var DRAG = null;
document.addEventListener('dragstart', function (e) { var k = e.target.closest && e.target.closest('[data-card]'); if (k && k.classList.contains('kcard')) { DRAG = k.dataset.card; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', DRAG); } catch (x) {} } });
document.addEventListener('dragover', function (e) { var col = e.target.closest && e.target.closest('[data-col]'); if (col && DRAG) { e.preventDefault(); document.querySelectorAll('.col.drop').forEach(function (c) { c.classList.remove('drop'); }); col.classList.add('drop'); } });
document.addEventListener('drop', function (e) { var col = e.target.closest && e.target.closest('[data-col]'); if (col && DRAG) { e.preventDefault(); var k = S.cards.filter(function (x) { return x.id === DRAG; })[0]; DRAG = null; if (k && k.stage !== col.dataset.col) moveCard(k, col.dataset.col); else render(); } });
document.addEventListener('dragend', function () { DRAG = null; document.querySelectorAll('.col.drop').forEach(function (c) { c.classList.remove('drop'); }); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && MODAL && MODAL.indexOf('welcome') < 0) closeModal(); });

/* tabs in the demo bar */
document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { var m = { site: ['site', 'home'], crm: ['crm', 'dash'], portal: ['portal', 'projects'] }[b.dataset.area]; go(m[0], m[1]); }); });

load();
/* open a screen from a link such as index.html#crm-pipeline */
function fromHash() {
  var h = (location.hash || '').replace('#', ''); if (!h) return false;
  var p = h.split('-'), area = p[0], view = p.slice(1).join('-');
  var ok = { site: ['home', 'consult', 'thankyou', 'finder', 'guide', 'blog'], crm: ['dash', 'contacts', 'lists', 'automations', 'reminders', 'bookings', 'availability', 'pipeline', 'manual'], portal: ['projects', 'mytasks', 'calendar', 'chat', 'client'] };
  if (!ok[area] || ok[area].indexOf(view) < 0) return false;
  R.area = area; R.view = view; R.id = null; R.tab = 'overview';
  if (area === 'portal' && view === 'project') return false;
  return true;
}
window.addEventListener('hashchange', function () { if (fromHash()) { closeModal(); render(); window.scrollTo({ top: 0 }); } });
var fromLink = fromHash();
render();
var seen = false; try { seen = localStorage.getItem(KEY + '-seen') === '1'; } catch (x) {}
if (!seen && !fromLink) openModal(welcomeModal());
})();
